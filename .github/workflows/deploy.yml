on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Salesforce CLI with npm
        run: |
          npm install @salesforce/cli --global

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" | sf org login sfdx --url --alias SFDC Project --set-default --sfdx-url-stdin

      - name: Deploy to Salesforce
        run: |
          sf project deploy start --target-org SFDC Project --wait 30